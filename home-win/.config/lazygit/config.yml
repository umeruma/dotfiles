# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
# Windows: linked to %LOCALAPPDATA%\lazygit\ (lazygit's default config dir).

gui:
  commitHashLength: 0

promptToReturnFromSubprocess: false

os:
  editPreset: 'vscode'

# Syntax-highlighted diffs via delta (https://github.com/dandavison/delta).
# Cycle renderers with `|`. See https://github.com/jesseduffield/lazygit/blob/master/docs/Custom_DiffRenderers.md
git:
  diffRenderers:
    - command: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"


# Files: A = generate via PowerShell helper (see generate-commit-msg.ps1).
customCommands:
  - key: 'A'
    context: 'files'
    description: 'AI commit message → open prefilled commit panel'
    loadingText: 'Generating commit message with Cursor…'
    command: 'pwsh -NoProfile -File "{{ .Env.LOCALAPPDATA }}/lazygit/generate-commit-msg.ps1"'
    output: none
