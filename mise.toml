[settings]
# Required for `mise bootstrap` (packages, login shell, etc.)
experimental = true

[bootstrap.user]
login_shell = "/bin/zsh"

# Runs at the end of `mise bootstrap` (after packages / user / tools).
# `mise bootstrap` already applies [dotfiles] natively at step 3, but that
# skips the `clean` sweep; running deploy here is idempotent and clears
# links left over by entries removed from [dotfiles].
[tasks.bootstrap]
description = "Deploy dotfiles"
run = "mise run deploy"

[tasks.help]
description = "List available tasks"
run = "zsh script/help.zsh"
run_windows = "pwsh -NoProfile -Command \"Write-Host 'Task help is not supported on Windows.'; exit 1\""

[tasks.update]
description = "Fetch latest changes"
run = "zsh script/update.zsh"
run_windows = "pwsh -NoProfile -File script/update-windows.ps1"

[tasks.list]
description = "Show dotfiles to deploy"
run = "mise dotfiles status"

[tasks.clean]
description = "Remove deployed symlinks from $HOME"
run = "zsh script/clean.zsh"
run_windows = "pwsh -NoProfile -File script/clean-windows.ps1"

# `clean` runs first so entries removed from [dotfiles] don't leave
# stale links behind; apply then relinks everything in the allowlist.
[tasks.deploy]
description = "Deploy dotfiles to $HOME via mise [dotfiles]"
depends = ["clean"]
run = "mise dotfiles apply -y"

[tasks.install-apps]
description = "Install apps (Brewfile on Unix; winget + Cursor CLI on Windows)"
run = "zsh script/install-apps.zsh"
run_windows = "pwsh -NoProfile -File script/install-apps-windows.ps1"

[tasks.install-cursor-cli]
description = "Install Cursor CLI (official installer; Windows)"
run = "echo 'Task install-cursor-cli is only supported on Windows (macOS: brew install --cask cursor-cli).'; exit 1"
run_windows = "pwsh -NoProfile -File script/install-cursor-cli-windows.ps1"

[tasks.setup-kanata]
description = "Create kanata autostart shortcut (Windows)"
run = "echo 'Task setup-kanata is only supported on Windows.'; exit 1"
run_windows = "pwsh -NoProfile -File script/setup-kanata.ps1"

[tasks.theme]
description = "Install cendre terminal theme (Terminal.app / Windows Terminal)"
run = "zsh script/theme.zsh"
run_windows = "pwsh -NoProfile -File script/theme-windows.ps1"

[tasks.install-fonts]
description = "Download Moralerspace Neon + ChaliceIcons into ~/Library/Fonts (macOS)"
run = "zsh script/install-fonts.zsh"
run_windows = "pwsh -NoProfile -Command \"Write-Host 'Task install-fonts is not supported on Windows.'; exit 1\""

