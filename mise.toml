[settings]
# Required for `mise bootstrap` (packages, login shell, etc.)
experimental = true

[bootstrap.user]
login_shell = "/bin/zsh"

[tasks.update]
description = "Fetch latest changes"
run = "zsh script/update.zsh"
run_windows = "pwsh -NoProfile -File script/update-windows.ps1"

[tasks.theme]
description = "Install cendre theme (Terminal.app / Windows Terminal + bat cache for delta)"
run = "zsh script/theme.zsh"
run_windows = "pwsh -NoProfile -File script/theme-windows.ps1"

[tasks.install-fonts]
description = "Download Moralerspace Neon (+ ChaliceIcons on macOS) for the terminal"
run = "zsh script/install-fonts.zsh"
run_windows = "pwsh -NoProfile -File script/install-fonts-windows.ps1"

[tools]
gitleaks = "8"

