# Loaded on Windows only (merged with mise.toml).
# Applied by `mise run install-apps` (= `mise bootstrap packages apply`).
# Requires mise >= 2026.9.3, which added winget as a bootstrap package manager.

[bootstrap.packages]
"winget:Microsoft.VisualStudioCode" = "latest"
"winget:Anysphere.Cursor" = "latest"
"winget:ZedIndustries.Zed" = "latest"
"winget:Anthropic.Claude" = "latest"
"winget:Anthropic.ClaudeCode" = "latest"
"winget:SlackTechnologies.Slack" = "latest"
"winget:Tailscale.Tailscale" = "latest"
"winget:Unity.UnityHub" = "latest"
"winget:Zen-Team.Zen-Browser" = "latest"
"winget:Nota.Gyazo" = "latest"
"winget:AgileBits.1Password" = "latest"
"winget:jtroo.kanata_gui" = "latest"
"winget:Notion.Notion" = "latest"
"winget:Notion.NotionCalendar" = "latest"
"winget:Figma.Figma" = "latest"
"winget:JesseDuffield.lazygit" = "latest"
"winget:dandavison.delta" = "latest" # lazygit diff renderer (syntax highlighting)
"winget:sharkdp.bat" = "latest" # delta syntax-theme = cendre (bat theme cache)
"winget:Starship.Starship" = "latest" # prompt (home/.config/starship.toml)
# LazyVim deps (see nix/home-manager/tools/neovim.nix). tree-sitter-cli is not on winget;
# nvim-treesitter uses prebuilt parsers / needs a C toolchain if compiling.
"winget:Neovim.Neovim" = "latest"
"winget:BurntSushi.ripgrep.MSVC" = "latest"
"winget:sharkdp.fd" = "latest"
# nvim-treesitter (LazyVim) needs a C compiler on Windows.
"winget:BrechtSanders.WinLibs.POSIX.UCRT" = "latest"
# ponytail: Raycast は msstore 由来の ID。旧 apps.winget では `source: msstore` を
# 明示していた。winget の暗黙のソース解決に任せている。解決できなければ
# `winget install --id 9PFXXSHC64H3 --source msstore` を手動で。
"winget:9PFXXSHC64H3" = "latest"

# Windows-side [dotfiles]. The shared block at the end lists the same files as
# mise.linux.toml; macOS links them with home-manager (nix/home-manager/dotfiles.nix).
# `mise dotfiles apply` creates missing parent dirs, so no prepare-subdirs step.
# NOTE: `mode = "symlink"` needs Developer Mode (Settings -> System ->
# For developers). Without it mise silently copies instead, and edits made in
# $HOME no longer flow back into this repo.

[dotfiles]
"~/.gitconfig" = { source = "home-win/.gitconfig", mode = "symlink" }
"~/.config/mise/config.toml" = { source = "home-win/.config/mise/config.toml", mode = "symlink" }
"~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" = { source = "home-win/Documents/PowerShell/Microsoft.PowerShell_profile.ps1", mode = "symlink" }
"~/Documents/kanata/kanata.kbd" = { source = "home-win/Documents/kanata/kanata.kbd", mode = "symlink" }
# lazygit defaults to %LOCALAPPDATA%\lazygit on Windows (not ~/.config).
"~/AppData/Local/lazygit/config.yml" = { source = "home-win/.config/lazygit/config.yml", mode = "symlink" }
"~/AppData/Local/lazygit/generate-commit-msg.ps1" = { source = "home-win/.config/lazygit/generate-commit-msg.ps1", mode = "symlink" }
# bat on Windows uses %APPDATA%\bat (not ~/.config/bat).
"~/AppData/Roaming/bat/themes/cendre.tmTheme" = { source = "extras/bat/cendre.tmTheme", mode = "symlink" }
# Neovim / LazyVim: Windows config dir is %LOCALAPPDATA%\nvim (same tree as Unix).
"~/AppData/Local/nvim" = { source = "home/.config/nvim", mode = "symlink" }
# herdr defaults to %APPDATA%\herdr on Windows (not ~/.config).
"~/AppData/Roaming/herdr/config.toml" = { source = "home-win/.config/herdr/config.toml", mode = "symlink" }

# Shared with mise.linux.toml
# AI agents — single source of truth: home/.agents.
# ~/.agents is linked whole-dir on purpose: Cursor and Copilot read
# ~/.agents/skills natively, and skill installers (npx skills) write
# installed skills + .skill-lock.json through the link into the repo,
# so installs are tracked by git. Claude Code only reads
# ~/.claude/skills, so repo-authored skills get per-skill entries there.
# (On Windows a whole-dir symlink becomes a junction; writes still pass through.)
"~/.agents" = { source = "home/.agents", mode = "symlink" }
"~/.claude/CLAUDE.md" = { source = "home/.claude/CLAUDE.md", mode = "symlink" }
"~/.copilot/instructions/global.instructions.md" = { source = "home/.agents/instructions/global.instructions.md", mode = "symlink" }
"~/.claude/skills/commit" = { source = "home/.agents/skills/commit", mode = "symlink" }
"~/.claude/skills/dev-server" = { source = "home/.agents/skills/dev-server", mode = "symlink" }
"~/.claude/skills/git-wt" = { source = "home/.agents/skills/git-wt", mode = "symlink" }
"~/.claude/skills/dev-crit" = { source = "home/.agents/skills/dev-crit", mode = "symlink" }
"~/.claude/skills/wt-slots" = { source = "home/.agents/skills/wt-slots", mode = "symlink" }
# Installed via `npx skills add -g` (tracked through ~/.agents); declared here so fresh machines get the Claude Code link too.
"~/.claude/skills/natural-japanese" = { source = "home/.agents/skills/natural-japanese", mode = "symlink" }
"~/.claude/skills/orca-cli" = { source = "home/.agents/skills/orca-cli", mode = "symlink" }
"~/.claude/skills/orchestration" = { source = "home/.agents/skills/orchestration", mode = "symlink" }
# Cursor marketplace plugins (install state itself lives in Cursor's state DB).
"~/.cursor/settings.json" = { source = "home/.cursor/settings.json", mode = "symlink" }
# cendre for delta (git include); bat theme is per-OS (config-dir differs).
"~/.config/delta/cendre.gitconfig" = { source = "extras/delta/cendre.gitconfig", mode = "symlink" }
# starship reads ~/.config/starship.toml on every OS (Windows included).
"~/.config/starship.toml" = { source = "home/.config/starship.toml", mode = "symlink" }

# Linux / Windows link with `mise dotfiles apply` (also step 3 of `mise bootstrap`).
# It never removes a link whose entry is gone: `clean` drops every link into
# the repo, then apply relinks what is still declared.
[tasks.list]
description = "Show dotfiles to link"
run = "mise dotfiles status"

[tasks.clean]
description = "Remove symlinks into the repo from $HOME (then: mise dotfiles apply)"
run = "pwsh -NoProfile -File script/win/clean-windows.ps1"

[tasks.install-fonts]
description = "Download Moralerspace Neon for Windows Terminal (macOS: nix/home-manager/tools/fonts.nix)"
run = "pwsh -NoProfile -File script/win/install-fonts-windows.ps1"

[tasks.install-apps]
description = "Install apps (winget + Cursor CLI + herdr)"
run = "pwsh -NoProfile -File script/win/install-apps-windows.ps1"

[tasks.install-cursor-cli]
description = "Install Cursor CLI (official installer)"
run = "pwsh -NoProfile -File script/win/install-cursor-cli-windows.ps1"

[tasks.install-herdr]
description = "Install herdr (official installer)"
run = "pwsh -NoProfile -File script/win/install-herdr-windows.ps1"

[tasks.setup-kanata]
description = "Create kanata autostart shortcut"
run = "pwsh -NoProfile -File script/win/setup-kanata.ps1"
