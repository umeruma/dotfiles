# Minimal prompt, adapted from Omarchy's config/starship.toml: directory, branch, status, ❯.
# Source: https://github.com/omacom/omarchy — MIT License, Copyright (c) David Heinemeier Hansson.
# Plain glyphs only so it renders without a Nerd Font (Windows Terminal included).
add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = "= "
up_to_date = ""
untracked  = "? "
modified   = "! "
stashed    = "$ "
staged     = "+ "
renamed    = "» "
deleted    = "✘ "
